{{- if and (kindIs "map" .Values.serviceAccount) .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "standard-cron.serviceAccountName" . }}
  labels:
    {{- include "standard-cron.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
