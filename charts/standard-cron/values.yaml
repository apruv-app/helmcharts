# Default values for standard-cron.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

suspend: false
restartPolicy: OnFailure

# CronJob spec
concurrencyPolicy: Forbid
# startingDeadlineSeconds: 120
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
# timeZone: "America/Los_Angeles"

# Job spec
activeDeadlineSeconds: 7200
backoffLimit: 3

# Naming / identity
nameOverride: ""
fullnameOverride: ""
# Service account configuration. Three shapes are supported:
#   1. `serviceAccountName: "<name>"` — canonical, references an existing SA.
#   2. `serviceAccount: { create: true, name: "<name>", annotations: {...} }` —
#      chart creates the SA (use this for Workload Identity).
#   3. `serviceAccount: "<name>"` — legacy string; references an existing SA.
serviceAccountName: ""
serviceAccount:
  create: false
  name: ""
  annotations: {}

# Pod
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Containers
resources: {}
volumes: []
volumeMounts: []
extraContainers: []
extraInitContainers: []
imagePullSecrets: []
