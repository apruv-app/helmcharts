{{- $volumeNames := dict -}}
{{- $mountPaths := dict -}}
{{- if .Values.tls.enabled -}}
{{- $_ := set $volumeNames "tls-certificate" true -}}
{{- $_ := set $mountPaths "/etc/tls" true -}}
{{- end -}}
{{- range .Values.extraVolumes -}}
{{- $name := required "extraVolumes requires a name" .name -}}
{{- if hasKey $volumeNames $name -}}{{- fail (printf "duplicate volume name %s" $name) -}}{{- end -}}
{{- $_ := set $volumeNames $name true -}}
{{- end -}}
{{- range .Values.extraVolumeMounts -}}
{{- $name := required "extraVolumeMounts requires a name" .name -}}
{{- $path := required "extraVolumeMounts requires a mountPath" .mountPath -}}
{{- if not (hasKey $volumeNames $name) -}}{{- fail (printf "unknown volume name %s" $name) -}}{{- end -}}
{{- if hasKey $mountPaths $path -}}{{- fail (printf "duplicate mount path %s" $path) -}}{{- end -}}
{{- $_ := set $mountPaths $path true -}}
{{- end -}}
{{- $selectorLabels := include "standard-service.selectorLabels" . | fromYaml -}}
{{- range $key, $value := .Values.podLabels -}}
{{- if hasKey $selectorLabels $key -}}
{{- fail (printf "podLabels must not override selector label %s" $key) -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "standard-service.fullname" . }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "standard-service.labels" . | nindent 4 }}
spec:
  {{- with .Values.deploymentStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "standard-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "standard-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "standard-service.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: {{ .Chart.Name }}
          {{- if or .Values.tls.enabled .Values.extraVolumeMounts }}
          volumeMounts:
          {{- if .Values.tls.enabled }}
          - name: tls-certificate
            mountPath: /etc/tls
            readOnly: true
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ required "Image must be specified" .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            {{- if .Values.service.ports.http }}
            - name: https
              containerPort: {{ .Values.service.ports.http }}
              protocol: TCP
            {{- end }}
            {{- if .Values.service.ports.health }}
            - name: http-health
              containerPort: {{ .Values.service.ports.health }}
              protocol: TCP
            {{- end }}
            {{- if .Values.service.ports.metrics }}
            - name: http-metrics
              containerPort: {{ .Values.service.ports.metrics }}
              protocol: TCP
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{- toYaml .Values.envVars | nindent 12 }}
      {{- if or .Values.tls.enabled .Values.extraVolumes }}
      volumes:
      {{- if .Values.tls.enabled }}
      - name: tls-certificate
        secret:
          secretName: {{ .Values.tls.secretName }}
      {{- end }}
      {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
