{{- if .Values.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "standard-service.fullname" . }}
  labels:
    {{- include "standard-service.labels" . | nindent 4 }}
spec:
  type: {{ default "ClusterIP" .Values.service.type }}
  selector:
    {{- include "standard-service.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.service.ports.http }}
    {{- if kindIs "map" .Values.service.ports.http }}
    - protocol: TCP
      port: {{ required "service.ports.http.port is required when http is a map" .Values.service.ports.http.port }}
      name: http
      targetPort: {{ default .Values.service.ports.http.port .Values.service.ports.http.targetPort }}
    {{- else }}
    - protocol: TCP
      port: {{ .Values.service.ports.http }}
      name: http
      targetPort: {{ .Values.service.ports.http }}
    {{- end }}
    {{- end }}
    {{- if .Values.service.ports.https }}
    {{- if kindIs "map" .Values.service.ports.https }}
    - protocol: TCP
      port: {{ required "service.ports.https.port is required when https is a map" .Values.service.ports.https.port }}
      name: https
      targetPort: {{ default .Values.service.ports.https.port .Values.service.ports.https.targetPort }}
    {{- else }}
    - protocol: TCP
      port: {{ .Values.service.ports.https }}
      name: https
      targetPort: {{ .Values.service.ports.https }}
    {{- end }}
    {{- end }}
    {{- if .Values.service.ports.health }}
    - protocol: TCP
      port: {{ .Values.service.ports.health }}
      name: http-health
      targetPort: {{ .Values.service.ports.health }}
    {{- end }}
    {{- if .Values.service.ports.metrics }}
    - protocol: TCP
      port: {{ .Values.service.ports.metrics }}
      name: http-metrics
      targetPort: {{ .Values.service.ports.metrics }}
    {{- end }}
{{- end }}
