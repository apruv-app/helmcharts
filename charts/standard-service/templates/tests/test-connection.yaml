apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "standard-service.fullname" . }}-test-connection"
  labels:
    {{- include "standard-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "standard-service.fullname" . }}:{{ include "standard-service.testServicePort" . }}']
  restartPolicy: Never
